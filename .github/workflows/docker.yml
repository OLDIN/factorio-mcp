name: Publish image

# Builds the service image (linux/amd64 and linux/arm64) and pushes it to GitHub Container
# Registry as ghcr.io/<owner>/factorio-mcp:<version> and :latest. Runs when a merged change bumps
# the version in mod/factorio-mcp/info.json (the one version of the whole project), or by hand.
# A version that is already published is never overwritten, so a version tag always means the
# same image.
on:
  push:
    branches: [main]
    paths:
      - mod/factorio-mcp/info.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    # Manual runs from other branches must not publish unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and image name
        id: meta
        run: |
          version=$(jq -r .version mod/factorio-mcp/info.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in info.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Registry names must be lowercase; the owner name may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factorio-mcp" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already published?
        id: exists
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION already exists, nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.published == 'false'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Summary
        if: steps.exists.outputs.published == 'false'
        run: echo "### Published ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
