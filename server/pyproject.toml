[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-mcp"
version = "0.2.1"
description = "Read-only MCP server for Factorio, talking to the factorio-mcp mod over RCON"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["factorio_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "live: needs a running local dev Factorio server; run via scripts/live.sh",
]
