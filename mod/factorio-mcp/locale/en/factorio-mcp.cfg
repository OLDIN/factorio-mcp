[mod-name]
factorio-mcp=Factorio MCP

[mod-description]
factorio-mcp=Read-only queries for an external MCP service over RCON. Does nothing on its own and cannot change the game.

[mod-setting-name]
factorio-mcp-work-per-tick=MCP job: work per tick
factorio-mcp-idle-work-per-poll=MCP job: work per poll when nobody is online

[mod-setting-description]
factorio-mcp-work-per-tick=How much work a large read-only query (base overview, big area) does each tick while players are online, in units of about 10 microseconds (50 is about half a millisecond). Lower is smoother for players; higher finishes sooner.
factorio-mcp-idle-work-per-poll=How much work such a query does per poll when nobody is online (nobody can notice it).
