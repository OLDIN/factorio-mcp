[mod-name]
factorio-mcp=Factorio MCP

[mod-description]
factorio-mcp=Read-only queries for an external MCP service over RCON. Does nothing on its own and cannot change the game.

[mod-setting-name]
factorio-mcp-chunks-per-tick=MCP job: chunks per tick
factorio-mcp-idle-chunks-per-poll=MCP job: chunks per poll when nobody is online

[mod-setting-description]
factorio-mcp-chunks-per-tick=How many map chunks a large read-only query (base overview, big area) scans each tick while players are online. Lower is smoother for players; higher finishes sooner.
factorio-mcp-idle-chunks-per-poll=How many map chunks such a query scans per poll when nobody is online (nobody can notice the work).
